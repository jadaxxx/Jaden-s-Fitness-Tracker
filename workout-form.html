<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fitness Tracker - Add/Edit Workout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <span class="brand">Jaden's Fitness Tracker</span>
  <a href="index.html">Dashboard</a>
  <a href="workouts.html">Workouts</a>
  <a href="workout-form.html" class="active">Add Workout</a>
</nav>

<main>
  <div class="eyebrow">Log Activity</div>
  <h1 id="form-title">Add Workout</h1>

  <div class="card">
    <form id="workout-form">
      <label for="date">Date</label>
      <input type="date" id="date" required>

      <label for="type">Exercise Type</label>
      <select id="type" required>
        <option value="Running">Running</option>
        <option value="Cycling">Cycling</option>
        <option value="Weights">Weights</option>
        <option value="Yoga">Yoga</option>
        <option value="Swimming">Swimming</option>
        <option value="Other">Other</option>
      </select>

      <label for="duration">Duration (minutes)</label>
      <input type="number" id="duration" min="1" required>

      <label for="calories">Calories Burned</label>
      <input type="number" id="calories" min="0">

      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional notes..."></textarea>

      <div class="form-actions">
        <button type="submit" class="btn" id="submit-btn">Save Workout</button>
        <a href="workouts.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</main>

<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');

  if (editId) {
    const w = getWorkoutById(editId);
    if (w) {
      document.getElementById('form-title').textContent = 'Edit Workout';
      document.getElementById('submit-btn').textContent = 'Update Workout';
      document.getElementById('date').value = w.date;
      document.getElementById('type').value = w.type;
      document.getElementById('duration').value = w.duration;
      document.getElementById('calories').value = w.calories || '';
      document.getElementById('notes').value = w.notes || '';
    }
  } else {
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
  }

  document.getElementById('workout-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      date: document.getElementById('date').value,
      type: document.getElementById('type').value,
      duration: Number(document.getElementById('duration').value),
      calories: Number(document.getElementById('calories').value) || 0,
      notes: document.getElementById('notes').value.trim(),
    };

    if (editId) {
      updateWorkout(editId, data);
    } else {
      addWorkout(data);
    }
    window.location.href = 'workouts.html';
  });
</script>

</body>
</html>
